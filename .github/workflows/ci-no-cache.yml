name: CI (no cache)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Dependency download
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
